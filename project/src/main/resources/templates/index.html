<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security6">
<head>
    <meta charset="UTF-8">
    <title>Computer Shop</title>
</head>
<body>
    <div style="text-align: right; padding: 10px; border-bottom: 1px solid #ccc; margin-bottom: 20px;">
        <div sec:authorize="isAuthenticated()">
            <span>Welcome, <b sec:authentication="name"></b> |</span>
            <form th:action="@{/logout}" method="post" style="display:inline;"><button type="submit">Logout</button></form>
        </div>
        <div sec:authorize="!isAuthenticated()">
            <a th:href="@{/login}">Login</a> | <a th:href="@{/register}">Register</a>
        </div>
    </div>

    <div style="margin-bottom: 20px;">
        <a th:href="@{/cart}" style="font-size: 1.2em; font-weight: bold;">🛒 View Cart</a>
    </div>

    <h1>Product Management</h1>
    <a th:href="@{/showNewProductForm}">Add New Product</a>
    <hr>
    <table border="1">
        <thead>
            <tr>
                <th>Product Name</th>
                <th>Price</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="product : ${listProducts}">
                <td th:text="${product.name}"></td>
                <td th:text="${product.price}"></td>
                <td>
                    <a th:href="@{/showFormForUpdate/{id}(id=${product.id})}">Update</a>
                    |
                    <a th:href="@{/deleteProduct/{id}(id=${product.id})}">Delete</a>
                    |
                    <a th:href="@{/cart/add/{id}(id=${product.id})}"><b>Add to Cart</b></a>
                </td>
            </tr>
        </tbody>
    </table>
</body>
</html>
