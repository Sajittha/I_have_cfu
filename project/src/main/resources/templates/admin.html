<!DOCTYPE html>
<html lang="th" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security6">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - I HAVE CFu</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">

    <nav class="bg-blue-900 text-white shadow-lg">
        <div class="max-w-7xl mx-auto px-4">
            <div class="flex justify-between items-center py-4">
                <a th:href="@{/}" class="text-2xl font-bold">🖥️ I HAVE CFu</a>
                <div class="flex items-center space-x-4">
                   <a th:href="@{/}" class="bg-blue-700 hover:bg-blue-600 px-4 py-2 rounded-lg transition-colors">
                       กลับสู่หน้าหลัก
                   </a>
                </div>
            </div>
        </div>
    </nav>

    <div class="max-w-7xl mx-auto px-4 py-8">
        <div class="bg-white rounded-lg shadow-lg p-6 mb-8">
            <h3 class="text-3xl font-bold text-gray-800 mb-6">จัดการสินค้า (Admin Panel)</h3>

            <div class="bg-gray-50 rounded-lg p-6 mb-8 border border-gray-200">
                <h4 class="text-xl font-semibold mb-4 text-gray-700">เพิ่ม / แก้ไข สินค้า</h4>
                <form th:action="@{/saveProduct}" th:object="${product}" method="post" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <input type="hidden" th:field="*{id}" />

                    <input type="text" th:field="*{name}" placeholder="ชื่อสินค้า" class="border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-blue-500" required>
                    <input type="number" th:field="*{price}" step="0.01" placeholder="ราคา" class="border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-blue-500" required>
                    <input type="text" th:field="*{imageUrl}" placeholder="URL รูปภาพ" class="md:col-span-2 border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-blue-500">

                    <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded-lg transition-colors md:col-span-2 font-semibold">
                        บันทึกสินค้า
                    </button>
                </form>
            </div>

            <div>
                <h4 class="text-xl font-semibold mb-4 text-gray-700">รายการสินค้าทั้งหมด</h4>
                <div class="overflow-x-auto">
                    <table class="min-w-full bg-white">
                        <thead class="bg-gray-800 text-white">
                            <tr>
                                <th class="text-left py-3 px-4 uppercase font-semibold text-sm">ชื่อสินค้า</th>
                                <th class="text-left py-3 px-4 uppercase font-semibold text-sm">ราคา</th>
                                <th class="text-left py-3 px-4 uppercase font-semibold text-sm">Actions</th>
                            </tr>
                        </thead>
                        <tbody class="text-gray-700">
                            <tr th:each="p : ${listProducts}" class="border-b border-gray-200 hover:bg-gray-50">
                                <td class="py-3 px-4" th:text="${p.name}"></td>
                                <td class="py-3 px-4" th:text="'฿' + ${#numbers.formatDecimal(p.price, 0, 'COMMA', 2, 'POINT')}"></td>
                                <td class="py-3 px-4">
                                    <a th:href="@{/showFormForUpdate/{id}(id=${p.id})}" class="bg-yellow-500 hover:bg-yellow-600 text-white px-3 py-1 rounded text-sm">แก้ไข</a>
                                    <a th:href="@{/deleteProduct/{id}(id=${p.id})}" class="bg-red-500 hover:bg-red-600 text-white px-3 py-1 rounded text-sm" onclick="return confirm('คุณต้องการลบสินค้านี้ใช่หรือไม่?');">ลบ</a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
