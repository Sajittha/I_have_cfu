<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><title>Shopping Cart</title></head>
<body>
    <h1>Your Shopping Cart</h1>
    <table border="1">
        <thead>
            <tr>
                <th>Product Name</th>
                <th>Price</th>
                <th>Quantity</th>
                <th>Total</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="item : ${cartItems}">
                <td th:text="${item.productName}"></td>
                <td th:text="${item.price}"></td>
                <td>
                    <form th:action="@{/cart/update}" method="post">
                        <input type="hidden" name="productId" th:value="${item.productId}" />
                        <input type="number" name="quantity" th:value="${item.quantity}" min="1" style="width: 50px;" />
                        <button type="submit">Update</button>
                    </form>
                </td>
                <td th:text="${item.totalPrice}"></td>
                <td>
                    <a th:href="@{/cart/remove/{productId}(productId=${item.productId})}">Remove</a>
                </td>
            </tr>
        </tbody>
    </table>
    <h2>Total Price: $<span th:text="${totalPrice}">0.00</span></h2>
    <a th:href="@{/}">Continue Shopping</a>
</body>
</html>
