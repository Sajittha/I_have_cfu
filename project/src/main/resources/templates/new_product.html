<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><title>Add Product</title></head>
<body>
    <h1>Add Product Form</h1>
    <form th:action="@{/saveProduct}" th:object="${product}" method="POST">
        <input type="text" th:field="*{name}" placeholder="Product Name">
        <input type="number" step="0.01" th:field="*{price}" placeholder="Product Price">
        <input type="text" th:field="*{imageUrl}" placeholder="Image URL">
        <button type="submit">Save</button>
    </form>
</body>
</html>
