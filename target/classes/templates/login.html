<!DOCTYPE html>
<html lang="th" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - I HAVE CFu</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">

    <div class="bg-white rounded-lg shadow-xl p-8 max-w-md w-full mx-4">
        <div class="text-center mb-6">
            <a th:href="@{/}" class="text-2xl font-bold text-blue-900 no-underline">🖥️ I HAVE CFu</a>
            <h3 class="text-2xl font-bold text-gray-800 mt-4">เข้าสู่ระบบ</h3>
        </div>

        <div th:if="${param.error}" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative mb-4" role="alert">
            <span class="block sm:inline">ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง</span>
        </div>

        <form th:action="@{/login}" method="post" class="space-y-4">
            <input type="text" name="username" placeholder="Username" class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:ring-2 focus:ring-blue-500" required>
            <input type="password" name="password" placeholder="รหัสผ่าน" class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:ring-2 focus:ring-blue-500" required>
            
            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-3 rounded-lg transition-colors font-semibold">
                เข้าสู่ระบบ
            </button>
        </form>

        <div class="mt-6 text-center">
            <a th:href="@{/register}" class="text-blue-600 hover:text-blue-700">
                ยังไม่มีบัญชี? สมัครสมาชิก
            </a>
        </div>
    </div>

</body>
</html>
